overy',kind:'START HERE',description:'A structured conversation about your goal, availability and the right coaching approach.',price:'Complimentary consultation',stripeKey:'discovery'},{name:'1:1 Endurance Coaching',kind:'MOST PERSONALISED',description:'Bespoke swim, bike, run and recovery planning with direct accountability to Connor and Jared.',price:'Bespoke proposal',stripeKey:'coaching'},{name:'Corporate Programme',kind:'FOR TEAMS',description:'A tailored performance experience for your organisation, with optional event and film production.',price:'By proposal',stripeKey:'corporate'}]};

 {number:'01',type:'PRIVATE ENDURANCE',title:content.oneTitle,lead:'Built entirely around you.',description:content.oneDesc,best:content.oneBest||defaults.oneBest,route:'coaching',cta:'Explore private coaching',image:content.oneImage||defaults.oneImage},
 {number:'02',type:'TEAM PERFORMANCE',title:content.corpTitle,lead:'Achievement is a team sport.',description:content.corpDesc,best:content.corpBest||defaults.corpBest,route:'corporate',cta:'Explore corporate performance',image:content.corpImage||defaults.corpImage},
 {number:'03',type:'FILM & STORYTELLING',title:content.docTitle,lead:'The journey is the story.',description:content.docDesc,best:content.docBest||defaults.docBest,route:'stories',cta:'Explore documentary work',image:content.docImage||defaults.docImage}
 ].map((o,i)=>`<article class="offer-card ${i===offerSlide?'is-active':''}" data-offer-card="${i}" aria-label="${esc(o.title)}" aria-hidden="${i!==offerSlide}"><div class="offer-copy"><div class="offer-category">${o.number} / ${o.type}</div><h3>${esc(o.title)}</h3><p class="offer-lead">${esc(o.lead)}</p><p class="offer-description">${esc(o.description)}</p><div class="offer-fit"><strong>Best for:</strong> <span>${esc(o.best)}</span></div><button class="offer-cta" data-go="${o.route}">${esc(o.cta)} <span class="round-icon" aria-hidden="true">↗</span></button></div><div class="offer-media"><img src="${esc(safeImg(o.image))}" alt="Endurance athlete in training — temporary editorial photograph" loading="lazy" onerror="this.style.display='none'"><div class="offer-photo-caption">${o.number} / SHERIDAN PERFORMANCE</div></div></article>`).join('')}</div></div>
 <div class="offer-controls"><div class="offer-counter" id="offer-counter"><b>0${offerSlide+1}</b> / 03</div><div class="offer-controls-right"><span>Explore the options</span><button class="offer-arrow" aria-label="Previous offer" data-offer-step="-1">←</button><button class="offer-arrow" aria-label="Next offer" data-offer-step="1">→</button></div></div><div class="offer-after"><span>Not sure where to begin? Tell us what you have in mind.</span>${btn('apply','Start a conversation ↗','button')}</div><p class="offer-disclaimer">Example copy and stock imagery for concept review. Services to be confirmed with the Sheridan team.</p></div></section>
<section class="feature"><div class="feature-media" style="background-image:url('https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=1400&q=85')"></div><div class="feature-text"><div class="eyebrow">A DIFFERENT KIND OF COACH</div><h2>BUILT FOR<br>REAL LIFE.</h2><p>Early flights. Board meetings. Family commitments. The calendar never sits still — and your training shouldn't have to either. Our programmes adapt to the person, not the other way round.</p>${btn('coaching','Explore our coaching ↗','text-link')}</div></section>

<div class="container apply-grid"><div class="bodycopy"><div class="eyebrow">A PERSONAL CONVERSATION</div><h2>LET'S FIND<br>YOUR STARTING<br>LINE.</h2><p>This is an interactive demonstration of a consultation enquiry form. The form currently saves entries only in this browser, for review in the demo editor.</p><p><strong>Email:</strong> Thesheridanbrothers@gmail.com</p><p class="fine">For a live website, we would connect this to the real CRM, notification system and privacy policy.</p></div><div class="form-wrap"><form id="enquiry"><div class="admin-row"><label>First name<input name="first" required maxlength="70" placeholder="Alex"></label><label>Last name<input name="last" required maxlength="70" placeholder="Taylor"></label></div><label>Email address<input name="email" type="email" required maxlength="160" placeholder="alex@example.com"></label><label>I'm interested in<select name="interest"><option>Private coaching</option><option>Corporate performance</option><option>Documenting the journey</option><option>Speaking / seminars</option><option>Something else</option></select></label><label>Tell us about your goal<textarea name="goal" required maxlength="1500" placeholder="The challenge, race or team goal you're aiming for..."></textarea></label><button class="button" type="submit">Send demo enquiry →</button><p class="fine">Demo only: this does not send an email or contact Sheridan Performance.</p></form></div></div>`}
function adm(){const tab=adminTab;return `<div class="admin-shell"><div class="admin-head"><div class="container"><div class="eyebrow">PROTOTYPE CMS</div><h1 style="font:800 37px Manrope,sans-serif;letter-spacing:-.05em;margin:8px 0">CONTENT & BUSINESS STUDIO</h1><p class="fine">Editable mock backend. Changes persist in this browser only. Not authenticated or connected to a database.</p></div></div><div class="container admin-grid"><div class="admin-menu">${[['content','Website content'],['packages','Packages'],['videos','Video slots'],['leads','Enquiries & reporting']].map(([x,y])=>`<button data-tab="${x}" class="${x===tab?'active':''}">${y}</button>`).join('')}<button data-reset="1">Reset demo content ↺</button></div><div class="admin-panel">${tab==='content'?`<h2>Site content</h2><p class="smallnote">Edit the homepage messaging, service descriptions and hero image.</p><form id="admin-content"><label>Hero headline<input name="heroTitle" value="${esc(content.heroTitle)}"></label><label>Highlighted words<input name="heroAccent" value="${esc(content.heroAccent)}"></label><label>Hero description<textarea name="heroSubtitle">${esc(content.heroSubtitle)}</textarea></label><label>Hero image URL<input name="heroImage" value="${esc(content.heroImage)}"></label><div class="eyebrow" style="margin:27px 0 13px">THE THREE OFFERS · HOMEPAGE</div><label>Section heading (use a new line to highlight the second line)<textarea name="offersHeading">${esc(content.offersHeading||defaults.offersHeading)}</textarea></label><label>Supporting question<input name="offersQuestion" value="${esc(content.offersQuestion||defaults.offersQuestion)}"></label><div class="admin-row"><label>Offer 01 title<input name="oneTitle" value="${esc(content.oneTitle)}"></label><label>Offer 02 title<input name="corpTitle" value="${esc(content.corpTitle)}"></label></div><label>Offer 01 description<textarea name="oneDesc">${esc(content.oneDesc)}</textarea></label><label>Offer 01 best for<textarea name="oneBest">${esc(content.oneBest||defaults.oneBest)}</textarea></label><label>Offer 02 description<textarea name="corpDesc">${esc(content.corpDesc)}</textarea></label><label>Offer 02 best for<textarea name="corpBest">${esc(content.corpBest||defaults.corpBest)}</textarea></label><label>Offer 03 title<input name="docTitle" value="${esc(content.docTitle)}"></label><label>Offer 03 description<textarea name="docDesc">${esc(content.docDesc)}</textarea></label><label>Offer 03 best for<textarea name="docBest">${esc(content.docBest||defaults.docBest)}</textarea></label><div class="eyebrow" style="margin:27px 0 13px">CAROUSEL IMAGERY</div><label>Offer 01 image URL<input name="oneImage" value="${esc(content.oneImage||defaults.oneImage)}"></label><label>Offer 02 image URL<input name="corpImage" value="${esc(content.corpImage||defaults.corpImage)}"></label><label>Offer 03 image URL<input name="docImage" value="${esc(content.docImage||defaults.docImage)}"></label><button type="submit" class="button">Save changes →</button></form>`:

function selectOffer(next,instant=false){
 const track=document.getElementById('offer-track');if(!track)return;
 offerSlide=(next+3)%3;
 const cards=[...track.querySelectorAll('[data-offer-card]')];
 document.querySelectorAll('[data-offer-slide]').forEach(t=>t.setAttribute('aria-selected',String(Number(t.dataset.offerSlide)===offerSlide)));
 cards.forEach((card,i)=>{card.classList.toggle('is-active',i===offerSlide);card.setAttribute('aria-hidden',String(i!==offerSlide));if(i===offerSlide)card.removeAttribute('inert');else card.setAttribute('inert','');});
 const counter=document.getElementById('offer-counter');if(counter)counter.innerHTML='<b>0'+(offerSlide+1)+'</b> / 03';
 const gap=parseFloat(getComputedStyle(track).gap)||12;
 const px=offerSlide*((cards[0]?.getBoundingClientRect().width||0)+gap);
 if(instant){track.style.transition='none';track.style.transform='translate3d(-'+px+'px,0,0)';track.offsetHeight;track.style.transition='';}
 else track.style.transform='translate3d(-'+px+'px,0,0)';
}
let offerTouchX=null;
document.addEventListener('touchstart',e=>{if(e.target.closest('#offer-window'))offerTouchX=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(offerTouchX==null||!e.target.closest('#offer-window'))return;const d=e.changedTouches[0].clientX-offerTouchX;offerTouchX=null;if(Math.abs(d)>55)selectOffer(offerSlide+(d<0?1:-1));},{passive:true});
window.addEventListener('resize',()=>{if(route==='home')selectOffer(offerSlide,true)});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-offer-slide]')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();selectOffer(offerSlide+(e.key==='ArrowRight'?1:-1));document.querySelector('[data-offer-slide="'+offerSlide+'"]').focus();}});
function render(){renderNav();renderFooter();document.getElementById('main').innerHTML=({home,coaching,corporate,stories,apply,admin:adm}[route]||home)();renderModal();if(route==='home')requestAnimationFrame(()=>selectOffer(offerSlide,true));}
function go(x){route=x;menu=false;modal=null;render();window.scrollTo({top:0,behavior:'smooth'});try{history.replaceState(null,'','#'+x)}catch(e){}}
function ytId(raw){const s=String(raw||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;try{const u=new URL(s);if(['www.youtube.com','youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname))return u.searchParams.get('v')?.match(/^[\w-]{11}$/)?.[0]||null;if(u.hostname==='youtu.be')return u.pathname.replace('/','').match(/^[\w-]{11}$/)?.[0]||null;}catch(e){}return null}
function renderModal(){let m=document.getElementById('modal-root');if(!modal){m.innerHTML='';return}let inside='';if(modal.type==='video'){const id=ytId(content[modal.key]);inside=`<div class="eyebrow">SHERIDAN PERFORMANCE / VIDEO</div><h2>${modal.key==='intro'?'MEET THE SHERIDANS':'BEYOND THE BOARDROOM'}</h2>${id?`<div style="aspect-ratio:16/9"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" style="width:100%;height:100%;border:0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen title="Sheridan Performance film"></iframe></div>`:`<div class="video-placeholder"><span>YOUR STORY GOES HERE.</span><p>Video placeholder — add a YouTube URL in the demo editor.</p></div><p>For this section: authentic, founder-led talking-to-camera video, intercut with training, work and race-day footage.</p>`}`}
if(modal.type==='checkout'){const p=content.plans[modal.index]||content.plans[0];inside=`<div class="eyebrow">CHECKOUT PROTOTYPE</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="notice">DEMO MODE · This is not a real purchase. No card data or money will be collected.</div><label>Package status<input readonly value="${esc(p.price)}"></label><button class="button" data-mockbuy="${modal.index}">Simulate checkout →</button><p class="fine">When Stripe is configured, this button can redirect to Stripe Checkout in test mode using the included API example.</p>`}
if(modal.type==='success'){inside=`<div class="eyebrow">DEMONSTRATION COMPLETE</div><h2>CHECKOUT FLOW VERIFIED.</h2><p>The sample buyer experience has completed. No payment was made. Next step: connect the Stripe test account and real product/price IDs.</p><button class="button" data-close>Return to website →</button>`}
if(modal.type==='enquiry'){inside=`<div class="eyebrow">FORM PREVIEW</div><h2>ENQUIRY SAVED.</h2><p>Your demo enquiry was saved locally. View it in Editor demo → Enquiries & reporting. It was not sent to the Sheridan team.</p><button class="button" data-go="admin" data-close>View demo editor →</button>`}
m.innerHTML=`<div class="overlay" data-dismiss><div class="modal" role="dialog" aria-modal="true" aria-label="Preview dialog"><button class="x" data-close aria-label="Close">×</button>${inside}</div></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-menu],[data-close],[data-dismiss],[data-video],[data-checkout],[data-mockbuy],[data-tab],[data-reset],[data-offer-slide],[data-offer-step]');if(!t)return;if(t.hasAttribute('data-dismiss')&&e.target!==t)return;if(t.hasAttribute('data-go')){e.preventDefault();go(t.dataset.go);return}if(t.hasAttribute('data-menu')){menu=!menu;renderNav();return}if(t.hasAttribute('data-offer-slide')){selectOffer(Number(t.dataset.offerSlide));return}if(t.hasAttribute('data-offer-step')){selectOffer(offerSlide+Number(t.dataset.offerStep));return}if(t.hasAttribute('data-close')||t.hasAttribute('data-dismiss')){modal=null;renderModal();return}if(t.hasAttribute('data-video')){modal={type:'video',key:t.dataset.video==='intro'?'introVideo':'storyVideo'};renderModal();return}if(t.hasAttribute('data-checkout')){modal={type:'checkout',index:Number(t.dataset.checkout)};renderModal();return}if(t.hasAttribute('data-mockbuy')){if(!ENABLE_STRIPE_TEST_CHECKOUT){modal={type:'success'};renderModal();return}const plan=content.plans[Number(t.dataset.mockbuy)];t.disabled=true;t.textContent='Opening Stripe…';fetch('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:plan.stripeKey})}).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{if(!ok||!data.url)throw new Error(data.error||'Stripe unavailable');location.assign(data.url)}).catch(err=>{alert(err.message);t.disabled=false;t.textContent='Try test checkout →'});return}if(t.hasAttribute('data-tab')){adminTab=t.dataset.tab;render();return}if(t.hasAttribute('data-reset')){if(confirm('Reset prototype copy and packages? Existing demo leads will stay.')){content=structuredClone(defaults);save();render()}return}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id)return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());if(f.id==='enquiry'){leads.unshift({...d,date:new Date().toISOString()});save();modal={type:'enquiry'};renderModal();f.reset();return}if(f.id==='admin-content'){for(const k of ['heroTitle','heroAccent','heroSubtitle','heroImage','offersHeading','offersQuestion','oneTitle','oneDesc','oneBest','corpTitle','corpDesc','corpBest','docTitle','docDesc','docBest','oneImage','corpImage','docImage'])content[k]=d[k]||'';save();render();alert('Changes saved in this browser.');return}if(f.id==='admin-packages'){content.plans.forEach((p,i)=>{p.name=d['name'+i]||'';p.price=d['price'+i]||'';p.description=d['description'+i]||''});save();render();alert('Packages updated.');return}if(f.id==='admin-videos'){content.introVideo=d.introVideo||'';content.storyVideo=d.storyVideo||'';save();render();alert('Video links saved.');return}});
const start=location.hash.replace('#','');if(['home','coaching','corporate','stories','apply','admin'].includes(start))route=start;render();
})();
</script>
</body>
</html>
